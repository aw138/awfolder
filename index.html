<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行紀錄</title>
    <!-- Combined CSS Stylesheets -->
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/filters.css">
    <link rel="stylesheet" href="css/table.css">
</head>
<body>

    <div class="app-viewport-wrapper">
        <!-- 🎯 THE CORRECTED TOP CONTAINER BAR -->
        <div class="top-search-panel">
            <div class="search-and-action-row">
                <!-- Left Section: Search Input & Reset Button -->
                <div class="left-controls-group">
                    <div class="search-container">
                        <div class="search-wrapper">
                            <input type="text" id="tableSearch" class="search-box" placeholder="Search ...">
                            <button type="button" id="clearSearchBtn" class="custom-clear-btn" aria-label="Clear search" style="display: none;">&times;</button>
                        </div>
                    </div>
                    <button type="button" id="clearAllFiltersBtn" class="clear-all-btn">Reset</button>
                </div>
                
                <!-- Right Section: Show Checked Checkbox, Font Buttons, and Collapse Trigger -->
                <div class="right-controls-group">
                    <div class="manual-check-filter-box">
                        <label class="show-checked-filter-label">
                            <input type="checkbox" id="showCheckedOnlyToggle">Show checked only
                        </label>
                    </div>
                    <div class="font-size-controls">
                        <button type="button" id="decreaseFontBtn" class="font-ctrl-btn small-a" aria-label="Decrease text size">A-</button>
                        <button type="button" id="increaseFontBtn" class="font-ctrl-btn large-a" aria-label="Increase text size">A+</button>
                    </div>
                    <button type="button" id="dashboardToggleBtn" class="dashboard-arrow-toggle" aria-label="Toggle filters panel">&#8743;</button>
                </div>
            </div>
        </div>

        <!-- CONTAINER 2: DEDICATED SLICER FILTERS DECK PANEL -->
        <div class="filter-dashboard-panel">
            <div id="horizontalFiltersContainer" class="horizontal-filters-container"></div>
        </div>

        <!-- CONTAINER 3: MAIN DATA TABLE VIEWPORT -->
        <div class="table-container">
            <div class="table-scroll-wrapper">
                <table id="dataTable">
                    <thead>
                        <tr id="table-header-row">
                            <!-- Populated dynamically via JS Config -->
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Populated dynamically from JSON Cloud Datasets -->
                    </tbody>
                </table>
            </div>
            <div id="noResults" class="no-results" style="display: none;">No records match your criteria.</div>
        </div>
    </div>

    <!-- JavaScript Application Modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
