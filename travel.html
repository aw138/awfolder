<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行紀錄</title>
	<!-- v.8.0.2 -->
    <!-- Split CSS Stylesheets Loading Layers -->
    <link rel="stylesheet" href="css/core-layout.css">
    <link rel="stylesheet" href="css/filter-panel.css">
    <link rel="stylesheet" href="css/data-table.css">
    <link rel="stylesheet" href="css/dynamic-config.css">
    <link rel="stylesheet" href="css/stat-panel.css">
	<!-- 🎯 THE ADVANCED RESPONSIBLE LINK HOOK -->
	<!-- This loads conditionally and activates ONLY if the browser layout drops below 768px -->
	<link rel="stylesheet" href="css/mobile.css" media="screen and (max-width: 768px)">
</head>
<body>

    <div class="app-viewport-wrapper">
		<!-- CONTAINER 1: SEARCH, FILTERS AND CHECKBOX SELECTION FILTER -->
		<div class="top-search-panel">
		  
			<!-- ROW 1: Search & Reset on Left, Page Title in Center, Font & Dashboard Controls on Right -->
			<div class="panel-row-one">
		
				<!-- Row 1 Left DIV (Search Box Container) -->
				<div class="r1-left-container">
					<div class="search-wrapper">
						<input type="text" id="tableSearch" class="search-box" placeholder="Search ...">
						<button type="button" id="clearSearchBtn" class="custom-clear-btn" aria-label="Clear search" style="display: none;">&times;</button>
					</div>
				</div>
				
				<!-- Title Slot Centered Automatically [INDEX: 0.1.123] -->
				<div class="panel-row-center-title">
					<div class="header-title-stacked-wrapper">
						<span id="dynamicDashboardTitle" class="inline-row-dashboard-title"></span>
						<!-- 🎯 THE VERSION HOOK: Injected right below the text string line -->
						<span id="dynamicDashboardVersion" class="inline-row-dashboard-version"></span>
					</div>
				</div>
				
				<!-- Row 1 Right DIV (Font & Dashboard Collapse Controls) [INDEX: 0.1.166] -->
				<div class="r1-right-container">
					<!-- 🎯 ALL THREE ELEMENT KEYS NOW LIVE ON THE SAME STRUCTURAL LEVEL -->
					<button type="button" id="decreaseFontBtn" class="font-ctrl-btn small-a" aria-label="Decrease text size">A-</button>
					<button type="button" id="increaseFontBtn" class="font-ctrl-btn large-a" aria-label="Increase text size">A+</button>
					<button type="button" id="dashboardToggleBtn" class="dashboard-arrow-toggle" aria-label="Toggle filters panel">&#9650;</button>
				</div>
		
			</div>
		  
			<!-- ROW 2: Checkboxes/Filters Left, Results Badge Center, Global Expand Buttons Right -->
			<div class="panel-row-two">
			
				<!-- Row 2 Left DIV houses the 3 compact control tools from left to right -->
				<div class="r2-left-container">
					<button type="button" id="globalSlicersToggleBtn" class="global-slicers-expand-btn">&#10134</button>
					<label class="manual-check-filter-box" id="checkedFilterLabel" for="showCheckedOnlyToggle">
						<input type="checkbox" id="showCheckedOnlyToggle" style="display: none !important;">
						<span id="checkedFilterCounterText" class="show-checked-filter-label">✅ 0</span>
					</label>
					<button type="button" id="clearAllFiltersBtn" class="clear-all-btn">C</button>
				</div>
				
				<!-- Row 2 Center Badge Slot holds our relocated counter chip -->
				<div class="panel-row-two-center-slot">
					<span id="tableResultsCounter" class="results-counter-badge"></span>
				</div>
				
				<!-- Row 2 Right DIV houses switcher buttons only -->
				<div class="r2-right-container">
					<div id="profileSwitcherContainerDeck" class="profile-switcher-container-deck"></div>
				</div>
			
			</div>
		</div>
        <!-- CONTAINER 2: DEDICATED SLICER FILTERS DECK PANEL -->
        <div class="filter-dashboard-panel">
            <div id="horizontalFiltersContainer" class="horizontal-filters-container"></div>
        </div>
		<!-- 🌟 NEW SLICER REPLACEMENT CONTAINER: GLOBAL MIRROR CHIPS DECK -->
		<div id="globalMirrorChipsDeck" class="global-mirror-chips-deck" style="display: none;">
			<div class="mirror-deck-title"></div>  <!-- Chip container label here -->
			<div id="mirrorChipsWrapper" class="mirror-chips-wrapper"></div>
		</div>

		<!-- 🎯 REPLACE VERBATIM WITH THIS UPDATED BLOCK Layer: -->
		<!-- NEW MODULE HOOK: REAL-TIME ANALYTICAL STATS ROW CONTROLLER -->
		<div id="tableStatisticsDeckPanel" class="table-statistics-deck-panel" style="display: none;">
			<div id="statFieldActiveColumnTitle" class="stat-panel-active-column-title">Stats |</div>
			
			<div class="stat-metric-card-block">
				<span id="statLabelMean" class="metric-card-label">Mean:</span> 
				<span id="statFieldMeanValue" class="stat-metric-value-span">0.00</span>
			</div>
			<div class="stat-metric-card-block">
				<span id="statLabelSD" class="metric-card-label">SD:</span> 
				<span id="statFieldSDValue" class="stat-metric-value-span">0.00</span>
			</div>
			<div class="stat-metric-card-block">
				<span id="statLabelTotal" class="metric-card-label">Total:</span> 
				<span id="statFieldTotalValue" class="stat-metric-value-span">0.00</span>
			</div>
		</div>

		<!-- CONTAINER 3: MAIN DATA TABLE -->
		<div class="table-container">
            <div class="table-scroll-wrapper">
                <table id="dataTable">
						<!-- 🎯 REPLACE VERBATIM WITH THIS PURE EMPTY PLACEHOLDER CONTAINER: -->
						<thead>
							<tr></tr>
						</thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="noResults" class="no-results" style="display: none;">No records match your criteria.</div>
        </div>
    </div>

    <!-- Sequential Script Dependencies Layer Injection -->
	<script>
        window.APP_DATA_SOURCE_URL = "https://aw138.github.io/awfolder/travel-data+config.json";
	</script>
    <script src="js/ui-core.js"></script>
    <script src="js/ui-slicer-state.js"></script>
    <script src="js/ui-slicer-view.js"></script>
    <script src="js/core-search.js"></script>
    <script src="js/table-sort.js"></script>
    <script src="js/dynamic-app.js"></script>
</body>
</html>
